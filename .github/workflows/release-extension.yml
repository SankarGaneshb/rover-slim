name: Release Rover-Slim Docker Desktop Extension & Core Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_approval:
        description: 'Skip human-in-the-loop approval gate and publish directly'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Multi-Arch Images and Publish to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 & AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Extension Metadata
        id: meta-extension
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim-extension
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Multi-Arch Docker Desktop Extension
        uses: docker/build-push-action@v5
        with:
          context: .
          file: extension/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-extension.outputs.tags }}
          labels: ${{ steps.meta-extension.outputs.labels }}

      - name: Extract Core Engine Metadata
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Multi-Arch Core Engine Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}

      - name: Update Docker Hub Extension Description & Overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim-extension
          short-description: "Autonomous container optimization, AST dependency segregation, and GoA Sentinel verification Docker Desktop Extension."
          readme-filepath: ./README.md

      - name: Update Docker Hub Core Engine Description & Overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim
          short-description: "Autonomous container optimization, AST dependency segregation, and Green-on-Arrival engine."
          readme-filepath: ./README.md

  # --------------------------------------------------------------------------
  # Step 1 (Autonomous): Sync Floating GitHub Action Tags (v1, v1.1)
  # --------------------------------------------------------------------------
  sync-floating-tags:
    name: Sync Floating Action Tags (v1)
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Floating Tags on Remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${GITHUB_REF_NAME}
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f1,2)
          echo "Updating floating tag $MAJOR to point to $TAG"
          git tag -fa "$MAJOR" -m "Rover-Slim $MAJOR Floating Release Tag"
          git push origin "$MAJOR" --force
          echo "Updating floating tag $MINOR to point to $TAG"
          git tag -fa "$MINOR" -m "Rover-Slim $MINOR Floating Minor Tag"
          git push origin "$MINOR" --force

  # --------------------------------------------------------------------------
  # Step 2 (Autonomous): Live Registry Smoke Test & Stage Draft Release
  # --------------------------------------------------------------------------
  smoke-test-and-stage:
    name: Live Registry Smoke Test & Draft Release Staging
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Hub Images are Pullable
        run: |
          echo "Verifying Docker Hub images can be pulled cleanly..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim-extension:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim:latest

      - name: Smoke Test Core Engine Container
        run: |
          echo "Testing container startup and version display..."
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim:latest --version
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/rover-slim:latest --help

      - name: Stage Draft Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            echo "Staging draft release with auto-generated release notes..."
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Rover-Slim $GITHUB_REF_NAME Release" \
              --generate-notes
          fi

      - name: Post Smoke Test Verification & HIL Review Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🛡️ Post-Release Cloud Verification & HIL Gate
          
          ### ✅ Autonomous Verification Passed:
          - **Multi-Arch Docker Images**: Built & published to Docker Hub (\`linux/amd64\`, \`linux/arm64\`).
          - **Live Registry Smoke Test**: Both \`bsankarganesh/rover-slim-extension:latest\` and \`bsankarganesh/rover-slim:latest\` pulled and executed cleanly with zero local intervention.
          - **Action Floating Tag**: \`v1\` tag automatically pointed to \`${{ github.ref_name }}\`.
          - **Draft Release**: Staged on GitHub with auto-generated changelog.

          ### 👤 Human-In-The-Loop (HIL) Action:
          1. Review the staged draft release notes on GitHub.
          2. Click **Approve and publish** in the **release-approval** environment gate below to make this release public and trigger directory re-indexing!
          
          ### 📢 Community Launch Text (Ready to Share):
          > **Rover-Slim ${{ github.ref_name }} is live!** Shrink Docker containers by ~80% with AST dependency pruning & GoA sentinel health checks.
          > Install via CLI in Docker Desktop & Rancher Desktop:
          > `docker extension install bsankarganesh/rover-slim-extension:latest`
          > `rdctl extension install bsankarganesh/rover-slim-extension:latest`
          > GitHub: https://github.com/SankarGaneshb/rover-slim
          EOF

  # --------------------------------------------------------------------------
  # Step 3 (HIL Gate): Human-in-the-Loop Approval & Final Distribution
  # --------------------------------------------------------------------------
  approve-and-publish:
    name: Human Approval (HIL) & Production Distribution
    runs-on: ubuntu-latest
    needs: [sync-floating-tags, smoke-test-and-stage]
    environment:
      name: release-approval
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Publish Official GitHub Release (Promote from Draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Promoting draft release $GITHUB_REF_NAME to published public release..."
          gh release edit "$GITHUB_REF_NAME" --draft=false || true

      - name: Ping M8ven Trust Index & Directory Re-Indexing
        continue-on-error: true
        run: |
          echo "Triggering M8ven directory re-indexing ping..."
          curl -s -X POST "https://m8ven.ai/api/v1/mcp/refresh?repo=sankarganeshb/rover-slim" || true

      - name: Release Finalization Succeeded
        run: |
          echo "### 🚀 Release Successfully Published & Distributed!" >> $GITHUB_STEP_SUMMARY
          echo "Human-in-the-loop approval granted. Rover-Slim ${{ github.ref_name }} is officially public." >> $GITHUB_STEP_SUMMARY
