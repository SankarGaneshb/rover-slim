name: Rover-Slim CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Unit Tests & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=rover_slim --cov-report=term-missing

  ui-tests:
    name: Docker Extension React UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/ui
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/ui/package.json

      - name: Install npm dependencies
        run: npm install

      - name: Run Vitest Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build

  dogfood-self-optimization:
    name: Autonomous Self-Optimization (Dogfooding)
    runs-on: ubuntu-latest
    needs: [python-tests, ui-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rover-Slim Core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Self-Optimization & GoA Sentinel Verification
        run: |
          rover-slim optimize . --verify-goa

      - name: Validate Output Artifacts & Anti-Recursion Safety
        run: |
          test -f .rover-slim/report.json
          test -f requirements-prod.txt
          test -f Dockerfile
          echo "Self-optimization dogfooding completed cleanly with zero recursion."
