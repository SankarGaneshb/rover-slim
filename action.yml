name: "Rover-Slim Container Optimization & Governance"
description: "Audit, optimize, and shrink polyglot containers (Java, .NET, Node.js, Python) via AST dependency pruning, multi-stage builds, and GoA sentinel checks."
author: "Sankar Ganesh B"
branding:
  icon: "zap"
  color: "green"

inputs:
  project_path:
    description: "Path to project root"
    required: false
    default: "."
  max_image_size_mb:
    description: "Maximum allowable uncompressed image size in MB"
    required: false
    default: "350"
  max_wasted_percent:
    description: "Maximum allowable layer waste percentage"
    required: false
    default: "10"
  verify_goa:
    description: "Run Green-on-Arrival sentinel verification probes"
    required: false
    default: "true"
  auto_commit:
    description: "Automatically commit and push segregated requirements and multi-stage Dockerfile"
    required: false
    default: "false"
  github_token:
    description: "GitHub token for commenting on PRs"
    required: false
    default: "${{ github.token }}"

outputs:
  size_reduction_pct:
    description: "Percentage container size reduction achieved"
    value: "${{ steps.run-rover-slim.outputs.reduction_pct }}"
  optimized_size_mb:
    description: "Final optimized image size in MB"
    value: "${{ steps.run-rover-slim.outputs.optimized_size_mb }}"
  report_json:
    description: "Structured JSON metrics summary"
    value: "${{ steps.run-rover-slim.outputs.report_json }}"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Rover-Slim
      shell: bash
      run: |
        pip install "${{ github.action_path }}"

    - name: Run Rover-Slim Container Optimization
      id: run-rover-slim
      shell: bash
      run: |
        rover-slim optimize "${{ inputs.project_path }}" --verify-goa
        if [ -f .rover-slim/report.json ]; then
          python -c '
          import json, os
          try:
              with open(".rover-slim/report.json", "r", encoding="utf-8") as f:
                  rep = json.load(f)
              base = float(rep.get("baseline", {}).get("uncompressed_size_mb", 0.0))
              opt = float(rep.get("optimized", {}).get("uncompressed_size_mb", 0.0))
              pct = round(((base - opt) / base * 100), 1) if base > 0 else 0.0
              out_file = os.environ.get("GITHUB_OUTPUT")
              if out_file:
                  with open(out_file, "a", encoding="utf-8") as out:
                      out.write(f"reduction_pct={pct}\n")
                      out.write(f"optimized_size_mb={opt:.1f}\n")
                      out.write(f"report_json={json.dumps(rep)}\n")
          except Exception as e:
              print(f"Warning: could not export outputs: {e}")
          '
        fi

    - name: Auto-commit Optimized Artifacts
      if: inputs.auto_commit == 'true'
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Dockerfile .dockerignore requirements-prod.txt pom.xml.rover-prod package.json.rover-prod 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "chore(rover-slim): auto-commit optimized Dockerfile and production dependencies [skip ci]"
          git push
        fi

    - name: Post PR Summary Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          if (fs.existsSync('.rover-slim/summary.md')) {
            const summary = fs.readFileSync('.rover-slim/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }
